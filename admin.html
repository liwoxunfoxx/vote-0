
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投票管理後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 16px;
      background: #f7f5f2;
      color: #333;
    }

    h1, h2, h3 {
      color: #51443e;
    }

    input, button, textarea, select {
      padding: 10px;
      margin: 5px 0;
      font-size: 15px;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      max-width: 400px;
    }

    .edit-form {
      border-top: 1px solid #ddd2ca;
      margin-top: 16px;
      padding-top: 16px;
    }

    .edit-form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .edit-option {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd2ca;
      border-radius: 6px;
    }

    .edit-option button, .edit-form button {
      margin-right: 8px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #796458;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .danger {
      background: #b74343;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 18px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0000000c;
      overflow-wrap: anywhere;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-box {
      flex: 1;
      min-width: 150px;
      padding: 16px;
      background: #eee6df;
      border-radius: 8px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: bold;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 12px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ddd2ca;
      padding: 10px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      background: #eee6df;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #dashboard {
      display: none;
    }

    .muted {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>投票管理後台</h1>
  <p><a href="index.html">返回投票頁</a></p>

  <section id="login">
    <h2>管理者登入</h2>

    <input
      id="email"
      type="email"
      placeholder="管理者電子郵件"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="密碼"
      autocomplete="current-password"
    >

    <button id="loginBtn">登入</button>
  </section>

  <section id="dashboard">
    <p id="account"></p>

    <button id="refreshBtn">重新整理統計</button>
    <button id="logoutBtn">登出</button>

    <h2>統計資料</h2>

    <div class="stats">
      <div class="stat-box">
        <div>投票總數</div>
        <div id="statPolls" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div>累積選項票數</div>
        <div id="statVotes" class="stat-number">0</div>
      </div>
    </div>

    <h2>投票列表</h2>
    <div id="pollList"></div>
  </section>

  <p id="message" role="status"></p>

  <script>
    const SUPABASE_URL =
      'https://dyohuufplhbuwyjqwsxk.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_sMXsZYCo7shVUDDttkny-A_Leod4sUv';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = id => document.getElementById(id);

    function showMessage(text) {
      $('message').textContent = text;
    }

    function addCell(row, text, isHeader = false) {
      const cell = document.createElement(isHeader ? 'th' : 'td');
      cell.textContent = String(text);
      row.appendChild(cell);
      return cell;
    }

    function addField(form, labelText, control) {
      const label = document.createElement('label');
      label.textContent = labelText;
      label.appendChild(control);
      form.appendChild(label);
      return control;
    }

    function makeSelect(choices, current) {
      const select = document.createElement('select');
      for (const [value, label] of choices) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        select.appendChild(option);
      }
      select.value = String(current);
      return select;
    }

    function buildEditForm(row) {
      const poll = row.data || {};
      const currentOptions = Array.isArray(poll.options) ? poll.options : [];
      const hasVotes = currentOptions.some(option => Number(option.votes || 0) > 0);
      const form = document.createElement('form');
      form.className = 'edit-form';
      form.hidden = true;

      const title = document.createElement('input');
      title.type = 'text';
      title.required = true;
      title.value = poll.title || '';
      addField(form, '投票主題', title);

      const desc = document.createElement('textarea');
      desc.rows = 2;
      desc.value = poll.desc || poll.description || '';
      addField(form, '補充說明', desc);

      const deadline = document.createElement('input');
      deadline.type = 'datetime-local';
      deadline.required = true;
      const deadlineDate = new Date(poll.deadline);
      if (!Number.isNaN(deadlineDate.getTime())) {
        deadline.value = new Date(deadlineDate.getTime() - deadlineDate.getTimezoneOffset() * 60000)
          .toISOString().slice(0, 16);
      }
      addField(form, '截止時間', deadline);

      const multiple = makeSelect([['false', '單選'], ['true', '多選']], !!poll.isMultiple);
      const anonymous = makeSelect([['true', '匿名'], ['false', '填寫姓名']], !!poll.isAnonymous);
      multiple.disabled = hasVotes;
      anonymous.disabled = hasVotes;
      addField(form, '選擇模式', multiple);
      addField(form, '投票者名稱', anonymous);
      if (hasVotes) {
        const note = document.createElement('p');
        note.className = 'muted';
        note.textContent = '已有票數的投票不可變更單選／多選與匿名設定。';
        form.appendChild(note);
      }

      const maxSelections = document.createElement('input');
      maxSelections.type = 'number';
      maxSelections.min = '1';
      maxSelections.value = String(poll.isMultiple
        ? (Number.isInteger(Number(poll.maxSelections)) && Number(poll.maxSelections) >= 1
          ? poll.maxSelections : currentOptions.length)
        : 1);
      const maxLabel = document.createElement('label');
      maxLabel.textContent = '每次最多可選幾項';
      maxLabel.appendChild(maxSelections);
      form.appendChild(maxLabel);

      const optionsLabel = document.createElement('p');
      optionsLabel.textContent = '選項';
      optionsLabel.style.fontWeight = 'bold';
      form.appendChild(optionsLabel);
      const optionList = document.createElement('div');
      form.appendChild(optionList);

      function updateLimit() {
        maxLabel.hidden = multiple.value !== 'true';
        maxSelections.required = multiple.value === 'true';
        maxSelections.max = String(optionList.children.length);
        if (Number(maxSelections.value) > optionList.children.length) {
          maxSelections.value = String(optionList.children.length);
        }
      }
      multiple.addEventListener('change', updateLimit);

      function addOption(option = {}, refreshLimit = true) {
        const optionRow = document.createElement('div');
        optionRow.className = 'edit-option';
        optionRow.dataset.id = option.id || `opt-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        optionRow._image = option.image || '';
        optionRow._imagePromise = Promise.resolve();

        const text = document.createElement('input');
        text.type = 'text';
        text.required = true;
        text.placeholder = '選項名稱';
        text.value = option.text || '';
        optionRow.appendChild(text);

        const imageStatus = document.createElement('span');
        imageStatus.className = 'muted';
        imageStatus.textContent = optionRow._image ? '目前有圖片' : '沒有圖片';
        optionRow.appendChild(imageStatus);

        const file = document.createElement('input');
        file.type = 'file';
        file.accept = 'image/*';
        file.addEventListener('change', () => {
          const selected = file.files[0];
          if (!selected) return;
          if (!selected.type.startsWith('image/') || selected.size > 700 * 1024) {
            showMessage('圖片須為 700 KB 以下的圖片檔。');
            file.value = '';
            return;
          }
          optionRow._imagePromise = new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              optionRow._image = reader.result;
              imageStatus.textContent = selected.name;
              resolve();
            };
            reader.onerror = () => reject(new Error('圖片讀取失敗。'));
            reader.readAsDataURL(selected);
          });
        });
        optionRow.appendChild(file);

        const clearImage = document.createElement('button');
        clearImage.type = 'button';
        clearImage.textContent = '移除圖片';
        clearImage.addEventListener('click', () => {
          optionRow._imagePromise = Promise.resolve();
          optionRow._image = '';
          file.value = '';
          imageStatus.textContent = '沒有圖片';
        });
        optionRow.appendChild(clearImage);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '刪除選項';
        remove.disabled = Number(option.votes || 0) > 0;
        remove.title = remove.disabled ? '已有票數的選項不可刪除' : '';
        remove.addEventListener('click', () => {
          if (optionList.children.length <= 2) return showMessage('至少需要兩個選項。');
          optionRow.remove();
          updateLimit();
        });
        optionRow.appendChild(remove);
        optionList.appendChild(optionRow);
        if (refreshLimit) updateLimit();
      }

      currentOptions.forEach(option => addOption(option, false));
      updateLimit();
      const addButton = document.createElement('button');
      addButton.type = 'button';
      addButton.textContent = '新增選項';
      addButton.addEventListener('click', () => addOption());
      form.appendChild(addButton);

      const saveButton = document.createElement('button');
      saveButton.type = 'submit';
      saveButton.textContent = '儲存變更';
      form.appendChild(saveButton);

      const cancelButton = document.createElement('button');
      cancelButton.type = 'button';
      cancelButton.textContent = '取消';
      cancelButton.addEventListener('click', () => { form.hidden = true; });
      form.appendChild(cancelButton);

      form.addEventListener('submit', async event => {
        event.preventDefault();
        saveButton.disabled = true;
        try {
          const optionRows = Array.from(optionList.children);
          await Promise.all(optionRows.map(item => item._imagePromise));
          const options = optionRows.map(item => ({
            id: item.dataset.id,
            text: item.querySelector('input[type="text"]').value.trim(),
            image: item._image
          }));
          if (options.length < 2 || options.some(option => !option.text)) {
            throw new Error('至少需要兩個有名稱的選項。');
          }
          const isMultiple = multiple.value === 'true';
          const limit = isMultiple ? Number(maxSelections.value) : 1;
          if (!Number.isInteger(limit) || limit < 1 || limit > options.length) {
            throw new Error(`每次投票上限須介於 1 與 ${options.length} 之間。`);
          }
          const changes = {
            title: title.value.trim(), desc: desc.value.trim(),
            deadline: new Date(deadline.value).toISOString(),
            isMultiple, isAnonymous: anonymous.value === 'true',
            maxSelections: limit, options
          };
          const { data, error } = await db.rpc('admin_update_poll', {
            p_poll_id: row.id, p_changes: changes
          });
          if (error || data !== true) throw error || new Error('資料庫未確認更新。');
          showMessage('投票已更新。');
          await loadPolls();
        } catch (error) {
          showMessage('更新失敗：' + error.message);
        } finally {
          saveButton.disabled = false;
        }
      });
      return form;
    }

    $('loginBtn').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;

      if (!email || !password) {
        showMessage('請輸入電子郵件和密碼。');
        return;
      }

      $('loginBtn').disabled = true;
      showMessage('正在登入……');

      try {
        const { error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage('登入失敗：' + error.message);
          return;
        }

        await checkSession();
      } finally {
        $('loginBtn').disabled = false;
      }
    });

    $('password').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        $('loginBtn').click();
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      const { error } = await db.auth.signOut();

      if (error) {
        showMessage('登出失敗：' + error.message);
        return;
      }

      $('dashboard').style.display = 'none';
      $('login').style.display = 'block';
      $('password').value = '';

      showMessage('已登出。');
    });

    $('refreshBtn').addEventListener('click', loadPolls);

    async function checkSession() {
      const {
        data: { session },
        error: sessionError
      } = await db.auth.getSession();

      if (sessionError || !session) {
        $('login').style.display = 'block';
        $('dashboard').style.display = 'none';
        return;
      }

      showMessage('正在驗證管理者權限……');

      const { data, error } = await db.rpc('is_poll_admin');

      if (error || data !== true) {
        await db.auth.signOut();

        $('login').style.display = 'block';
        $('dashboard').style.display = 'none';

        showMessage(
          '管理者驗證失敗：' +
          (error?.message || '此帳號沒有管理者權限。')
        );
        return;
      }

      $('login').style.display = 'none';
      $('dashboard').style.display = 'block';
      $('account').textContent = '已登入：' + session.user.email;

      showMessage('');
      await loadPolls();
    }

    async function loadPolls() {
      $('refreshBtn').disabled = true;
      showMessage('正在讀取投票資料……');

      try {
        const { data, error } = await db.rpc('admin_list_polls');

        if (error) {
          showMessage('讀取失敗：' + error.message);
          return;
        }

        const polls = (Array.isArray(data) ? data : [])
          .map(row => ({
            id: row.id,
            data: row.data,
            created_at: row.created_at
          }))
          .sort((a, b) =>
            new Date(b.created_at || 0) - new Date(a.created_at || 0)
          );

        let totalVotes = 0;

        for (const row of polls) {
          const poll = row.data || {};

          for (const option of (poll.options || [])) {
            totalVotes += Number(option.votes || 0);
          }
        }

        $('statPolls').textContent = polls.length;
        $('statVotes').textContent = totalVotes;

        const list = $('pollList');
        list.replaceChildren();

        if (polls.length === 0) {
          list.textContent = '目前沒有投票。';
          showMessage('');
          return;
        }

        for (const row of polls) {
          const poll = row.data || {};
          const deadlineAt = new Date(poll.deadline).getTime();
          const isActive = Number.isFinite(deadlineAt) && deadlineAt > Date.now();
          const card = document.createElement('article');
          card.className = 'card';

          const title = document.createElement('h3');
          title.textContent = poll.title || row.id;
          card.appendChild(title);

          const description = document.createElement('p');
          description.textContent =
            poll.desc || poll.description || '沒有投票說明';
          card.appendChild(description);

          const created = document.createElement('p');
          created.className = 'muted';
          created.textContent = '建立時間：' +
            (row.created_at
              ? new Date(row.created_at).toLocaleString()
              : '未知');
          card.appendChild(created);

          const status = document.createElement('p');
          status.className = 'muted';
          status.textContent = '狀態：' + (isActive ? '進行中' : '已截止');
          card.appendChild(status);

          const options = poll.options || [];
          const tableWrap = document.createElement('div');
          tableWrap.className = 'table-wrap';

          const table = document.createElement('table');
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');

          addCell(headerRow, '選項', true);
          addCell(headerRow, '票數', true);
          addCell(headerRow, '投票者', true);

          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement('tbody');

          for (const option of options) {
            const tr = document.createElement('tr');

            addCell(
              tr,
              option.text || option.id || '未命名選項'
            );

            addCell(tr, Number(option.votes || 0));

            const voters = Array.isArray(option.voters)
              ? option.voters
              : [];

            addCell(
              tr,
              voters.length
                ? voters.join('、')
                : '尚無投票者資料'
            );

            tbody.appendChild(tr);
          }

          table.appendChild(tbody);
          tableWrap.appendChild(table);
          card.appendChild(tableWrap);

          if (poll.isMultiple) {
            const limit = document.createElement('p');
            limit.className = 'muted';
            limit.textContent = '每次最多可選 ' + (poll.maxSelections || options.length) + ' 項';
            card.appendChild(limit);
          }

          const editButton = document.createElement('button');
          editButton.textContent = '編輯投票';
          const editForm = buildEditForm(row);
          editButton.addEventListener('click', () => {
            editForm.hidden = !editForm.hidden;
          });
          card.appendChild(editButton);
          card.appendChild(editForm);

          if (isActive) {
            const endButton = document.createElement('button');
            endButton.textContent = '提前結束投票';
            endButton.addEventListener('click', async () => {
              if (!confirm(`確定立即結束「${poll.title || row.id}」？結束後將停止接收新票。`)) return;

              endButton.disabled = true;
              showMessage('正在結束投票……');
              try {
                const { data: ended, error: endError } = await db.rpc('admin_end_poll', {
                  p_poll_id: row.id
                });
                if (endError) throw endError;
                await loadPolls();
                showMessage(ended === true ? '投票已提前結束。' : '此投票已截止。');
              } catch (err) {
                showMessage('結束投票失敗：' + err.message);
                endButton.disabled = false;
              }
            });
            card.appendChild(endButton);
          }

          const deleteButton = document.createElement('button');
          deleteButton.className = 'danger';
          deleteButton.textContent = '刪除投票';

          deleteButton.addEventListener('click', async () => {
            const confirmed = confirm(
              `確定刪除「${poll.title || row.id}」？此操作無法復原。`
            );

            if (!confirmed) return;

            deleteButton.disabled = true;
            showMessage('正在刪除投票……');

            try {
              const { data: result, error: deleteError } =
                await db.rpc('admin_delete_poll', {
                  p_poll_id: row.id
                });

              if (deleteError || result !== true) {
                showMessage(
                  '刪除失敗：' +
                  (deleteError?.message || '投票不存在或未刪除')
                );
                deleteButton.disabled = false;
                return;
              }

              showMessage('投票已刪除。');
              await loadPolls();
            } catch (err) {
              showMessage('刪除失敗：' + err.message);
              deleteButton.disabled = false;
            }
          });

          card.appendChild(deleteButton);
          list.appendChild(card);
        }

        showMessage('');
      } catch (err) {
        showMessage('讀取失敗：' + err.message);
      } finally {
        $('refreshBtn').disabled = false;
      }
    }

    checkSession();

    db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        $('dashboard').style.display = 'none';
        $('login').style.display = 'block';
      }
    });
  </script>
</body>
</html>
