
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投票管理後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 16px;
      background: #f7f5f2;
      color: #333;
    }

    h1, h2, h3 {
      color: #51443e;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      font-size: 15px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 400px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #796458;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .danger {
      background: #b74343;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 18px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0000000c;
      overflow-wrap: anywhere;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-box {
      flex: 1;
      min-width: 150px;
      padding: 16px;
      background: #eee6df;
      border-radius: 8px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: bold;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 12px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ddd2ca;
      padding: 10px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      background: #eee6df;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #dashboard {
      display: none;
    }

    .muted {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>投票管理後台</h1>

  <section id="login">
    <h2>管理者登入</h2>

    <input
      id="email"
      type="email"
      placeholder="管理者電子郵件"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="密碼"
      autocomplete="current-password"
    >

    <button id="loginBtn">登入</button>
  </section>

  <section id="dashboard">
    <p id="account"></p>

    <button id="refreshBtn">重新整理統計</button>
    <button id="logoutBtn">登出</button>

    <h2>統計資料</h2>

    <div class="stats">
      <div class="stat-box">
        <div>投票總數</div>
        <div id="statPolls" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div>累積選項票數</div>
        <div id="statVotes" class="stat-number">0</div>
      </div>
    </div>

    <h2>投票列表</h2>
    <div id="pollList"></div>
  </section>

  <p id="message" role="status"></p>

  <script>
    const SUPABASE_URL =
      'https://dyohuufplhbuwyjqwsxk.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_sMXsZYCo7shVUDDttkny-A_Leod4sUv';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = id => document.getElementById(id);

    function showMessage(text) {
      $('message').textContent = text;
    }

    function addCell(row, text, isHeader = false) {
      const cell = document.createElement(isHeader ? 'th' : 'td');
      cell.textContent = String(text);
      row.appendChild(cell);
      return cell;
    }

    $('loginBtn').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;

      if (!email || !password) {
        showMessage('請輸入電子郵件和密碼。');
        return;
      }

      $('loginBtn').disabled = true;
      showMessage('正在登入……');

      try {
        const { error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage('登入失敗：' + error.message);
          return;
        }

        await checkSession();
      } finally {
        $('loginBtn').disabled = false;
      }
    });

    $('password').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        $('loginBtn').click();
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      const { error } = await db.auth.signOut();

      if (error) {
        showMessage('登出失敗：' + error.message);
        return;
      }

      $('dashboard').style.display = 'none';
      $('login').style.display = 'block';
      $('password').value = '';

      showMessage('已登出。');
    });

    $('refreshBtn').addEventListener('click', loadPolls);

    async function checkSession() {
      const {
        data: { session },
        error: sessionError
      } = await db.auth.getSession();

      if (sessionError || !session) {
        $('login').style.display = 'block';
        $('dashboard').style.display = 'none';
        return;
      }

      showMessage('正在驗證管理者權限……');

      const { data, error } = await db.rpc('is_poll_admin');

      if (error || data !== true) {
        await db.auth.signOut();

        $('login').style.display = 'block';
        $('dashboard').style.display = 'none';

        showMessage(
          '管理者驗證失敗：' +
          (error?.message || '此帳號沒有管理者權限。')
        );
        return;
      }

      $('login').style.display = 'none';
      $('dashboard').style.display = 'block';
      $('account').textContent = '已登入：' + session.user.email;

      showMessage('');
      await loadPolls();
    }

    async function loadPolls() {
      $('refreshBtn').disabled = true;
      showMessage('正在讀取投票資料……');

      try {
              const { data, error } = await db.rpc('admin_list_polls');

      if (error) {
        showMessage('讀取失敗：' + error.message);
        return;
      }

      const polls = (Array.isArray(data) ? data : [])
        .map(row => ({
          id: row.id,
          data: row.data,
          created_at: row.created_at
        }))
        .sort((a, b) =>
          new Date(b.created_at || 0) - new Date(a.created_at || 0)
        );

        if (error) {
          showMessage('讀取失敗：' + error.message);
          return;
        }

        let totalVotes = 0;

        for (const row of polls) {
          const poll = row.data || {};

          for (const option of (poll.options || [])) {
            totalVotes += Number(option.votes || 0);
          }
        }

        $('statPolls').textContent = polls.length;
        $('statVotes').textContent = totalVotes;

        const list = $('pollList');
        list.replaceChildren();

        if (polls.length === 0) {
          list.textContent = '目前沒有投票。';
          showMessage('');
          return;
        }

        for (const row of polls) {
          const poll = row.data || {};
          const card = document.createElement('article');
          card.className = 'card';

          const title = document.createElement('h3');
          title.textContent = poll.title || row.id;
          card.appendChild(title);

          const description = document.createElement('p');
          description.textContent =
            poll.description || '沒有投票說明';
          card.appendChild(description);

          const created = document.createElement('p');
          created.className = 'muted';
          created.textContent = '建立時間：' +
            (row.created_at
              ? new Date(row.created_at).toLocaleString()
              : '未知');
          card.appendChild(created);

          const options = poll.options || [];
          const tableWrap = document.createElement('div');
          tableWrap.className = 'table-wrap';

          const table = document.createElement('table');
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');

          addCell(headerRow, '選項', true);
          addCell(headerRow, '票數', true);
          addCell(headerRow, '投票者', true);

          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement('tbody');

          for (const option of options) {
            const tr = document.createElement('tr');

            addCell(
              tr,
              option.text || option.id || '未命名選項'
            );

            addCell(tr, Number(option.votes || 0));

            const voters = Array.isArray(option.voters)
              ? option.voters
              : [];

            addCell(
              tr,
              voters.length
                ? voters.join('、')
                : '尚無投票者資料'
            );

            tbody.appendChild(tr);
          }

          table.appendChild(tbody);
          tableWrap.appendChild(table);
          card.appendChild(tableWrap);

          const deleteButton = document.createElement('button');
          deleteButton.className = 'danger';
          deleteButton.textContent = '刪除投票';

          deleteButton.addEventListener('click', async () => {
            const confirmed = confirm(
              `確定刪除「${poll.title || row.id}」？此操作無法復原。`
            );

            if (!confirmed) return;

            deleteButton.disabled = true;
            showMessage('正在刪除投票……');

            try {
              const { data: result, error: deleteError } =
                await db.rpc('admin_delete_poll', {
                  p_poll_id: row.id
                });

              if (deleteError || result !== true) {
                showMessage(
                  '刪除失敗：' +
                  (deleteError?.message || '投票不存在或未刪除')
                );
                deleteButton.disabled = false;
                return;
              }

              showMessage('投票已刪除。');
              await loadPolls();
            } catch (err) {
              showMessage('刪除失敗：' + err.message);
              deleteButton.disabled = false;
            }
          });

          card.appendChild(deleteButton);
          list.appendChild(card);
        }

        showMessage('');
      } catch (err) {
        showMessage('讀取失敗：' + err.message);
      } finally {
        $('refreshBtn').disabled = false;
      }
    }

    checkSession();

    db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        $('dashboard').style.display = 'none';
        $('login').style.display = 'block';
      }
    });
  </script>
</body>
</html>
