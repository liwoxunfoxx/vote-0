<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極速線上投票系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg mb-8">
    <div class="max-w-4xl mx-auto px-4 py-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-check-to-slot text-2xl"></i>
        <h1 class="text-2xl font-bold tracking-wide">線上自訂投票站</h1>
      </div>
      <button onclick="openCreateModal()" class="bg-white text-indigo-600 font-semibold px-4 py-2 rounded-lg shadow hover:bg-slate-50 transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> 建立新投票
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4">
    <!-- Poll List -->
    <div id="pollList" class="space-y-6">
      <!-- 投票卡片將由 JS 動態生成 -->
    </div>
  </main>

  <!-- Create Poll Modal -->
  <div id="createModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-slate-800">發起新投票</h2>
        <button onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="pollForm" onsubmit="handleCreatePoll(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">投票主題 *</label>
          <input type="text" id="pollTitle" required placeholder="例：本週遊戲實況主題投票" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">詳細說明（選填）</label>
          <textarea id="pollDesc" rows="2" placeholder="補充說明投票規則或注意事項..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <!-- 設定區：單選/多選 & 是否匿名 -->
        <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded-lg border">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">投票模式</label>
            <select id="pollMultiple" class="w-full text-sm p-2 border rounded bg-white">
              <option value="false">單選 (只能選一個)</option>
              <option value="true">多選 (可勾選多個)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">匿名設定</label>
            <select id="pollAnonymous" class="w-full text-sm p-2 border rounded bg-white">
              <option value="true">開啟匿名 (無需填名)</option>
              <option value="false">關閉匿名 (需輸入姓名)</option>
            </select>
          </div>
        </div>

        <!-- 選項列表 -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">投票選項</label>
          <div id="optionsContainer" class="space-y-3">
            <!-- 動態產生選項 -->
          </div>
          <button type="button" onclick="addOptionInput()" class="mt-3 text-sm text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
            <i class="fa-solid fa-circle-plus"></i> 新增選項
          </button>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t">
          <button type="button" onclick="closeCreateModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100">取消</button>
          <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold shadow">建立投票</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let polls = JSON.parse(localStorage.getItem('my_polls')) || [
      {
        id: 'poll-1',
        title: '🎤 下一首 Cover 歌曲選擇！',
        desc: '請大家幫我選出下一首想聽的歌曲~',
        isMultiple: false,
        isAnonymous: true,
        options: [
          { id: 'opt-1', text: '歌曲 A', image: '', votes: 5, voters: [] },
          { id: 'opt-2', text: '歌曲 B', image: '', votes: 8, voters: [] }
        ]
      }
    ];

    let optionCount = 0;

    function savePolls() {
      localStorage.setItem('my_polls', JSON.stringify(polls));
      renderPolls();
    }

    function openCreateModal() {
      document.getElementById('createModal').classList.remove('hidden');
      document.getElementById('createModal').classList.add('flex');
      document.getElementById('optionsContainer').innerHTML = '';
      optionCount = 0;
      addOptionInput();
      addOptionInput();
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
      document.getElementById('createModal').classList.remove('flex');
    }

    function addOptionInput() {
      optionCount++;
      const id = optionCount;
      const div = document.createElement('div');
      div.className = 'p-3 border rounded-lg bg-slate-50 space-y-2 relative';
      div.id = `option-row-${id}`;
      div.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="text" class="option-text flex-1 px-3 py-1.5 text-sm border rounded outline-none focus:ring-1 focus:ring-indigo-500" placeholder="選項名稱 ${id}" required>
          <button type="button" onclick="removeOptionInput(${id})" class="text-rose-500 hover:text-rose-700 p-1">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500">
          <i class="fa-regular fa-image"></i>
          <label class="cursor-pointer text-indigo-600 hover:underline">
            上傳圖片 (選填)
            <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${id})">
          </label>
          <span id="img-preview-name-${id}" class="truncate max-w-[150px] text-slate-400"></span>
        </div>
        <input type="hidden" class="option-img-data" id="img-data-${id}">
      `;
      document.getElementById('optionsContainer').appendChild(div);
    }

    function removeOptionInput(id) {
      const row = document.getElementById(`option-row-${id}`);
      if (document.querySelectorAll('#optionsContainer > div').length > 2) {
        row.remove();
      } else {
        alert('至少需要提供 2 個投票選項！');
      }
    }

    function handleImageUpload(e, id) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById(`img-data-${id}`).value = evt.target.result;
          document.getElementById(`img-preview-name-${id}`).textContent = `已選擇: ${file.name}`;
        };
        reader.readAsDataURL(file);
      }
    }

    function handleCreatePoll(e) {
      e.preventDefault();
      const title = document.getElementById('pollTitle').value;
      const desc = document.getElementById('pollDesc').value;
      const isMultiple = document.getElementById('pollMultiple').value === 'true';
      const isAnonymous = document.getElementById('pollAnonymous').value === 'true';

      const optionRows = document.querySelectorAll('#optionsContainer > div');
      const options = [];

      optionRows.forEach((row, idx) => {
        const text = row.querySelector('.option-text').value;
        const image = row.querySelector('.option-img-data').value;
        if (text) {
          options.push({
            id: `opt-${Date.now()}-${idx}`,
            text: text,
            image: image || '',
            votes: 0,
            voters: []
          });
        }
      });

      const newPoll = {
        id: `poll-${Date.now()}`,
        title,
        desc,
        isMultiple,
        isAnonymous,
        options
      };

      polls.unshift(newPoll);
      savePolls();
      closeCreateModal();
      document.getElementById('pollForm').reset();
    }

    function castVote(pollId) {
      const poll = polls.find(p => p.id === pollId);
      if (!poll) return;

      let voterName = '';
      if (!poll.isAnonymous) {
        voterName = prompt('本投票為「非匿名投票」，請輸入您的姓名/暱稱：');
        if (!voterName || !voterName.trim()) {
          alert('必須輸入姓名才能投票！');
          return;
        }
      }

      const inputs = document.querySelectorAll(`input[name="poll-${pollId}"]:checked`);
      if (inputs.length === 0) {
        alert('請先選擇至少一個選項！');
        return;
      }

      inputs.forEach(input => {
        const opt = poll.options.find(o => o.id === input.value);
        if (opt) {
          opt.votes += 1;
          if (!poll.isAnonymous && voterName) {
            opt.voters.push(voterName.trim());
          }
        }
      });

      savePolls();
      alert('投票成功！');
    }

    function renderPolls() {
      const container = document.getElementById('pollList');
      container.innerHTML = '';

      polls.forEach(poll => {
        const totalVotes = poll.options.reduce((sum, o) => sum + o.votes, 0);

        let optionsHtml = '';
        poll.options.forEach(opt => {
          const percent = totalVotes === 0 ? 0 : Math.round((opt.votes / totalVotes) * 100);
          const inputType = poll.isMultiple ? 'checkbox' : 'radio';

          let votersListHtml = '';
          if (!poll.isAnonymous && opt.voters.length > 0) {
            votersListHtml = `<div class="text-xs text-slate-500 mt-1">投票者: ${opt.voters.join(', ')}</div>`;
          }

          optionsHtml += `
            <div class="border rounded-xl p-3 bg-white hover:border-indigo-300 transition space-y-2">
              <div class="flex items-center gap-3">
                <input type="${inputType}" name="poll-${poll.id}" value="${opt.id}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                
                ${opt.image ? `<img src="${opt.image}" class="w-12 h-12 object-cover rounded-md border">` : ''}

                <div class="flex-1">
                  <div class="flex justify-between text-sm font-medium text-slate-700">
                    <span>${opt.text}</span>
                    <span class="text-indigo-600 font-bold">${opt.votes} 票 (${percent}%)</span>
                  </div>
                  <div class="w-full bg-slate-100 rounded-full h-2 mt-1.5 overflow-hidden">
                    <div class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                  </div>
                  ${votersListHtml}
                </div>
              </div>
            </div>
          `;
        });

        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl shadow-sm border p-6 space-y-4';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full ${poll.isMultiple ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                  ${poll.isMultiple ? '多選' : '單選'}
                </span>
                <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full ${poll.isAnonymous ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                  ${poll.isAnonymous ? '匿名投票' : '實名投票'}
                </span>
              </div>
              <h3 class="text-xl font-bold text-slate-800">${poll.title}</h3>
              ${poll.desc ? `<p class="text-slate-500 text-sm mt-1">${poll.desc}</p>` : ''}
            </div>
            <span class="text-xs text-slate-400 font-medium">總票數: ${totalVotes}</span>
          </div>

          <div class="space-y-3">
            ${optionsHtml}
          </div>

          <div class="pt-2 flex justify-end">
            <button onclick="castVote('${poll.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-lg shadow transition text-sm">
              送出投票
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    renderPolls();
  </script>
</body>
</html>
